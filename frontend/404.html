<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 - Page Not Found | Everett Hotel">
  <title>404 - Page Not Found | Everett Hotel</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="/vendor/tailwindcss/tailwind.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/luxury.css">
  <link rel="stylesheet" href="css/main.css">
  <script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: '#8B5E34',
          'navy-light': '#A67C52',
          'navy-deep': '#24180F',
          gold: '#D4AF37',
          'gold-light': '#D4BC8A',
          'gold-soft': '#C9A227',
          beige: '#FAF7F2',
          'beige-dark': '#EDE7DB',
          ivory: '#F3E9DC',
          charcoal: '#211A14',
          emerald: '#0F766E',
        },
        fontFamily: {
          inter: ['Inter', 'sans-serif'],
          serif: ['Playfair Display', 'Georgia', 'serif'],
        },
      },
    },
  }
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(160deg, #24180F 0%, #8B5E34 45%, #A67C52 75%, #24180F 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #211A14;
    }
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }
    .gold-gradient-text { background: linear-gradient(120deg, #E8C96A 0%, #D4AF37 40%, #F0DFA8 60%, #C9A227 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    /* Page Loader */
    .page-loader { position: fixed; inset: 0; background: #24180F; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; transition: opacity 0.6s ease, visibility 0.6s ease; }
    .page-loader.hidden { opacity: 0; visibility: hidden; }
    .loader-text { font-family: 'Playfair Display', serif; font-size: 3.2rem; letter-spacing: 14px; color: #D4AF37; font-weight: 400; animation: loaderPulse 1.6s ease-in-out infinite; }
    .loader-sub { color: rgba(255,255,255,0.35); font-size: 0.65rem; letter-spacing: 8px; text-transform: uppercase; margin-top: 10px; }
    .loader-line { width: 160px; height: 1px; background: rgba(212,175,55,0.2); margin-top: 24px; overflow: hidden; }
    .loader-line::after { content: ''; display: block; width: 50%; height: 100%; background: #D4AF37; animation: loaderLine 1.4s ease-in-out infinite; }
    @keyframes loaderPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes loaderLine { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

    /* Background Decorations */
    .bg-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.03;
      background-image:
        radial-gradient(circle at 25% 25%, #D4AF37 1px, transparent 1px),
        radial-gradient(circle at 75% 75%, #D4AF37 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-1 {
      position: absolute;
      top: -20%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: -15%;
      left: -5%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    /* 404 Large Text */
    .error-code {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(8rem, 20vw, 17rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.02em;
      user-select: none;
      position: relative;
      z-index: 1;
      text-shadow: 0 0 80px rgba(212, 175, 55, 0.18);
    }

    /* Heading */
    .error-heading {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 300;
      color: #FAF7F2;
      letter-spacing: 0.05em;
      position: relative;
      z-index: 1;
    }

    .error-heading::after {
      content: '';
      display: block;
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #D4AF37, transparent);
      margin: 1rem auto 0;
    }

    /* Description */
    .error-description {
      color: rgba(246, 244, 239, 0.6);
      font-size: 1.05rem;
      line-height: 1.8;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      font-weight: 300;
    }

    /* Buttons */
    .btn-gold {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2.2rem;
      background: linear-gradient(120deg, #D4AF37, #C9A227);
      color: #8B5E34;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .btn-gold::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.5s ease;
    }

    .btn-gold:hover::before { left: 100%; }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(200, 169, 106, 0.35);
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2.2rem;
      background: transparent;
      color: #FAF7F2;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(246, 244, 239, 0.25);
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      z-index: 1;
    }

    .btn-outline:hover {
      border-color: #D4AF37;
      color: #D4AF37;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(200, 169, 106, 0.1);
    }

    /* Divider Line */
    .ornamental-line {
      display: flex;
      align-items: center;
      gap: 1rem;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .ornamental-line .line {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), transparent);
    }

    .ornamental-line .diamond {
      width: 6px;
      height: 6px;
      background: #D4AF37;
      transform: rotate(45deg);
      opacity: 0.6;
    }

    /* Copyright Footer */
    .copyright {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(246, 244, 239, 0.3);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 400;
      z-index: 1;
      white-space: nowrap;
    }

    .copyright a {
      color: rgba(212, 175, 55, 0.5);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .copyright a:hover { color: #D4AF37; }

    /* Floating Particles */
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(212, 175, 55, 0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: floatParticle 8s ease-in-out infinite;
    }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
      25% { opacity: 1; }
      50% { transform: translateY(-60px) translateX(20px); opacity: 0.6; }
      75% { opacity: 1; }
    }

    @media (max-width: 768px) { .loader-text { font-size: 2.2rem; letter-spacing: 8px; } .copyright { white-space: normal; text-align: center; } }
  </style>
</head>
<body class="lux-body">

  <!-- Page Loader -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-text">EVERETT</div>
    <div class="loader-sub">Luxury Hotel</div>
    <div class="loader-line"></div>
  </div>

  <!-- Background Decorations -->
  <div class="bg-pattern"></div>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Floating Particles -->
  <div class="particle" style="top: 15%; left: 20%; animation-delay: 0s;"></div>
  <div class="particle" style="top: 30%; left: 75%; animation-delay: 1.5s;"></div>
  <div class="particle" style="top: 60%; left: 10%; animation-delay: 3s;"></div>
  <div class="particle" style="top: 80%; left: 85%; animation-delay: 4.5s;"></div>
  <div class="particle" style="top: 45%; left: 50%; animation-delay: 2s;"></div>
  <div class="particle" style="top: 20%; left: 60%; animation-delay: 5.5s;"></div>
  <div class="particle" style="top: 70%; left: 35%; animation-delay: 7s;"></div>
  <div class="particle" style="top: 10%; left: 90%; animation-delay: 6s;"></div>

  <!-- Main Content -->
  <main class="font-inter relative z-10 flex flex-col items-center justify-center text-center px-6" style="min-height: 100vh; padding: 2rem;">

    <!-- Brand Hint -->
    <nav class="absolute top-8 left-8 flex items-center gap-3 z-10">
      <a href="index.html" class="text-gold/60 hover:text-gold transition-colors duration-300 text-sm tracking-widest uppercase font-semibold">
        <i class="fa-solid fa-hotel mr-2"></i> Everett
      </a>
    </nav>

    <!-- Error Code -->
    <div class="error-code gold-gradient-text" id="errorCode">404</div>

    <!-- Ornamental Divider -->
    <div class="ornamental-line my-8">
      <span class="line"></span>
      <span class="diamond"></span>
      <span class="line"></span>
    </div>

    <!-- Heading -->
    <h1 class="error-heading">Page Not Found</h1>

    <!-- Description -->
    <p class="error-description mt-6">
      The page you're looking for may have been moved, removed, or is temporarily unavailable.
      Please check the URL or navigate back to our homepage.
    </p>

    <!-- Buttons -->
    <div class="flex flex-wrap items-center justify-center gap-5 mt-10">
      <a href="index.html" class="btn-gold">
        <i class="fa-solid fa-house"></i> Back to Home
      </a>
      <button onclick="history.back()" class="btn-outline">
        <i class="fa-solid fa-arrow-left"></i> Go Back
      </button>
    </div>

  </main>

  <!-- Copyright Footer -->
  <footer class="copyright">
    &copy; <span id="currentYear"></span> <a href="index.html">Everett Hotel</a>. All Rights Reserved.
  </footer>

  <!-- Scripts -->
  <!-- GSAP & Plugins -->
  <script defer src="/vendor/gsap/gsap.min.js"></script>
  <script defer src="/vendor/gsap/ScrollTrigger.min.js"></script>
  <script defer src="/vendor/lenis/lenis.min.js"></script>

  <!-- Application Scripts -->
  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/animations.js"></script>

  <!-- Page Logic -->
  <script>
        // Set current year
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // Page Loader
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('pageLoader').classList.add('hidden');
                initAnimations();
            }, 1200);
        });

        // GSAP Animations
        function initAnimations() {
            gsap.registerPlugin(ScrollTrigger);

            // Initialize Lenis smooth scroll
            try {
                const lenis = new Lenis({
                    duration: 1.2,
                    easing: function(t) {
                        return Math.min(1, 1.001 - Math.pow(2, -10 * t));
                    },
                    smoothWheel: true,
                });

                function raf(time) {
                    lenis.raf(time);
                    requestAnimationFrame(raf);
                }
                requestAnimationFrame(raf);
            } catch(e) {
                // Lenis not available, fallback to default scroll
            }

            // 404 code animation
            const errorCode = document.getElementById('errorCode');
            errorCode.style.opacity = '0';
            errorCode.style.transform = 'scale(0.8) translateY(20px)';

            gsap.to(errorCode, {
                opacity: 1,
                scale: 1,
                y: 0,
                duration: 1.2,
                ease: 'power3.out',
                delay: 0.2,
            });

            // Floating 404 animation
            gsap.to(errorCode, {
                y: -10,
                duration: 3,
                ease: 'sine.inOut',
                yoyo: true,
                repeat: -1,
                delay: 1.5,
            });

            // Stagger elements
            const elements = document.querySelectorAll('.ornamental-line, .error-heading, .error-description, .btn-gold, .btn-outline');
            gsap.from(elements, {
                opacity: 0,
                y: 30,
                duration: 0.8,
                stagger: 0.15,
                ease: 'power2.out',
                delay: 0.6,
            });

            // Particle animations
            const particles = document.querySelectorAll('.particle');
            particles.forEach(function(particle, index) {
                gsap.to(particle, {
                    y: -80 - (index * 15),
                    x: (index % 2 === 0 ? 30 : -30),
                    opacity: 0,
                    duration: 6 + (index * 0.5),
                    ease: 'none',
                    repeat: -1,
                    delay: index * 0.8,
                });
                gsap.from(particle, {
                    opacity: 0,
                    duration: 2,
                    delay: index * 0.5,
                });
            });

            // Background glow subtle animation
            gsap.to('.bg-glow-1', {
                x: 20,
                y: 15,
                duration: 8,
                ease: 'sine.inOut',
                yoyo: true,
                repeat: -1,
            });

            gsap.to('.bg-glow-2', {
                x: -15,
                y: -20,
                duration: 10,
                ease: 'sine.inOut',
                yoyo: true,
                repeat: -1,
            });
        }
  </script>
</body>
</html>
