<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Everett Hotel account password with a secure token.">
  <title>Reset Password | Everett Hotel</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="/vendor/tailwindcss/tailwind.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="preload" href="/vendor/fontawesome/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css"></noscript>
  <link rel="stylesheet" href="css/main.css">
  <script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { navy: '#8B5E34', 'navy-light': '#A67C52', gold: '#D4AF37', 'gold-light': '#D4BC8A', beige: '#FAF7F2', charcoal: '#211A14' },
        fontFamily: { inter: ['Inter', 'sans-serif'] },
      },
    },
  }
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #FAF7F2; color: #211A14; overflow-x: hidden; }
    .btn-gold { background: #D4AF37; color: #8B5E34; font-weight: 700; transition: all 0.3s ease; }
    .btn-gold:hover { background: #D4BC8A; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(200,169,106,0.35); }
    .booking-input:focus { border-color: #D4AF37; box-shadow: 0 0 0 3px rgba(200,169,106,0.15); outline: none; }
    .page-loader { position: fixed; inset: 0; background: #24180F; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; transition: opacity 0.6s ease, visibility 0.6s ease; }
    .page-loader.hidden { opacity: 0; visibility: hidden; }
    .loader-text { font-family: 'Playfair Display', serif; font-size: 3.2rem; letter-spacing: 14px; color: #D4AF37; font-weight: 400; animation: loaderPulse 1.6s ease-in-out infinite; }
    .loader-sub { color: rgba(255,255,255,0.35); font-size: 0.65rem; letter-spacing: 8px; text-transform: uppercase; margin-top: 10px; }
    .loader-line { width: 160px; height: 1px; background: rgba(212,175,55,0.2); margin-top: 24px; overflow: hidden; }
    .loader-line::after { content: ''; display: block; width: 50%; height: 100%; background: #D4AF37; animation: loaderLine 1.4s ease-in-out infinite; }
    @keyframes loaderPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes loaderLine { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    .auth-error { display: none; background: rgba(220,53,69,0.1); border: 1px solid rgba(220,53,69,0.2); border-radius: 12px; padding: 12px 16px; font-size: 14px; color: #dc3545; }
    .auth-error.show { display: flex; align-items: center; gap: 8px; }
    .btn-auth { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 12px; border: none; cursor: pointer; background: linear-gradient(135deg, #D4AF37, #D4BC8A); color: #8B5E34; font-family: 'Inter', sans-serif; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-auth:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(200,169,106,0.4); }
    .btn-auth:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .btn-auth .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(139,94,52,0.2); border-top-color: #8B5E34; border-radius: 50%; animation: spin 0.6s linear infinite; }
    .btn-auth.loading .spinner { display: inline-block; }
    .btn-auth.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .password-strength-bar { height: 4px; border-radius: 2px; background: #e5e7eb; overflow: hidden; margin-bottom: 4px; }
    .password-strength-fill { height: 100%; border-radius: 2px; transition: all 0.3s ease; width: 0%; }
    .password-strength-text { font-size: 12px; color: #888; }
    .password-strength[data-strength="weak"] .password-strength-fill { width: 25%; background: #dc3545; }
    .password-strength[data-strength="fair"] .password-strength-fill { width: 50%; background: #fd7e14; }
    .password-strength[data-strength="good"] .password-strength-fill { width: 75%; background: #20c997; }
    .password-strength[data-strength="strong"] .password-strength-fill { width: 100%; background: #198754; }
  </style>
</head>
<body class="font-inter">
  <div class="page-loader" id="pageLoader">
    <div class="loader-text">EVERETT</div>
    <div class="loader-sub">Luxury Hotel</div>
    <div class="loader-line"></div>
  </div>

  <div class="min-h-screen flex">
    <div class="hidden lg:flex flex-1 items-center justify-center relative overflow-hidden" style="background:linear-gradient(135deg, #8B5E34, #A67C52, #8B5E34);">
      <div class="absolute inset-0 opacity-10" style="background: url('images/about.jpg') center/cover no-repeat;"></div>
      <div class="absolute inset-0" style="background:linear-gradient(135deg, rgba(139,94,52,0.92), rgba(139,94,52,0.85));"></div>
      <div class="relative z-10 text-center max-w-md px-8">
        <div class="mb-8">
          <span class="text-white text-3xl tracking-[10px] font-light">EVERETT</span><br>
          <span class="text-gold text-xs tracking-[5px] font-medium">HOTEL</span>
        </div>
        <div class="w-16 h-0.5 mx-auto mb-8" style="background:#D4AF37;"></div>
        <p class="text-white/90 text-xl italic leading-relaxed mb-8" style="font-family:Georgia,serif;">"Create a new password and return to your journey of elegance."</p>
        <span class="text-white/50 text-xs tracking-[3px] uppercase">New Password</span>
      </div>
    </div>

    <div class="flex-1 flex flex-col justify-center items-center px-6 py-12" style="background:#FAF7F2;">
      <div class="w-full max-w-md">
        <div class="lg:hidden text-center mb-8">
          <a href="index.html" class="inline-block">
            <span class="text-navy text-2xl tracking-[8px] font-light">EVERETT</span><br>
            <span class="text-gold text-[10px] tracking-[4px] font-medium">HOTEL</span>
          </a>
        </div>

        <div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-6" style="background:linear-gradient(135deg, rgba(200,169,106,0.15), rgba(200,169,106,0.04));">
          <i class="fas fa-shield-halved text-xl" style="color:#D4AF37;"></i>
        </div>
        <h2 class="text-3xl font-extrabold mb-2" style="color:#8B5E34;">Reset Password</h2>
        <p class="text-sm mb-8" style="color:#888;line-height:1.7;">Enter your new password below to complete the reset process.</p>

        <div class="auth-error" id="resetError"><i class="fas fa-circle-exclamation"></i><span id="resetErrorText"></span></div>

        <form id="resetForm" class="space-y-5">
          <div>
            <label class="block text-sm font-semibold mb-2" style="color:#8B5E34;">New Password</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
              <input type="password" class="booking-input w-full p-3.5 pl-11 rounded-xl border border-gray-200 text-sm bg-white" id="newPassword" placeholder="Enter new password" required minlength="8">
            </div>
            <div class="password-strength mt-2" id="passwordStrength">
              <div class="password-strength-bar"><div class="password-strength-fill"></div></div>
              <span class="password-strength-text"></span>
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-2" style="color:#8B5E34;">Confirm New Password</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
              <input type="password" class="booking-input w-full p-3.5 pl-11 rounded-xl border border-gray-200 text-sm bg-white" id="confirmPassword" placeholder="Re-enter new password" required>
            </div>
          </div>
          <button type="submit" class="btn-auth" id="resetBtn">
            <span class="btn-text"><i class="fas fa-check-circle"></i> Reset Password</span>
            <span class="spinner"></span>
          </button>
        </form>

        <p class="text-center text-sm mt-8" style="color:#888;">
          <a href="login.html" class="font-semibold" style="color:#D4AF37;"><i class="fas fa-arrow-left text-xs mr-1"></i> Back to Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/vendor/sweetalert2/sweetalert2.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/animations.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() { document.getElementById('pageLoader').classList.add('hidden'); }, 1200);

      var urlParams = new URLSearchParams(window.location.search);
      var token = urlParams.get('token');

      var passwordInput = document.getElementById('newPassword');
      var strengthEl = document.getElementById('passwordStrength');
      passwordInput.addEventListener('input', function() {
        var val = this.value;
        if (!val) { strengthEl.removeAttribute('data-strength'); strengthEl.querySelector('.password-strength-text').textContent = ''; return; }
        var score = 0;
        if (val.length >= 8) score++; if (val.length >= 12) score++; if (/[A-Z]/.test(val)) score++; if (/[0-9]/.test(val)) score++; if (/[^A-Za-z0-9]/.test(val)) score++;
        var level = score <= 1 ? 'weak' : score <= 2 ? 'fair' : score <= 3 ? 'good' : 'strong';
        var text = score <= 1 ? 'Weak' : score <= 2 ? 'Fair' : score <= 3 ? 'Good' : 'Strong';
        strengthEl.setAttribute('data-strength', level);
        strengthEl.querySelector('.password-strength-text').textContent = text + ' password';
      });

      var resetForm = document.getElementById('resetForm');
      var resetBtn = document.getElementById('resetBtn');
      var resetError = document.getElementById('resetError');
      var resetErrorText = document.getElementById('resetErrorText');

      resetForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        resetError.classList.remove('show');
        var password = document.getElementById('newPassword').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        if (!password || password.length < 8) { resetErrorText.textContent = 'Password must be at least 8 characters.'; resetError.classList.add('show'); return; }
        if (password !== confirmPassword) { resetErrorText.textContent = 'Passwords do not match.'; resetError.classList.add('show'); return; }
        if (!token) { resetErrorText.textContent = 'Invalid or expired reset token.'; resetError.classList.add('show'); return; }
        resetBtn.disabled = true; resetBtn.classList.add('loading');
        try {
          await Auth.resetPassword(token, password);
          if (typeof Swal !== 'undefined') {
            Swal.fire({ icon: 'success', title: 'Password Reset!', text: 'Your password has been reset successfully.', confirmButtonColor: '#D4AF37', background: '#8B5E34', color: '#fff' });
          }
          window.location.href = 'login.html';
        } catch (err) {
          resetErrorText.textContent = err.message || 'Failed to reset password.'; resetError.classList.add('show');
        }
        resetBtn.disabled = false; resetBtn.classList.remove('loading');
      });
    });
  </script>
</body>
</html>
